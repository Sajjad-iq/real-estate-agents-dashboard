version: '3.8'
services:
  app:
    build:
      context: ./app
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Uncomment if you want to mount local files for development
    # volumes:
    #   - ./app:/app

  # Optional: test runner
  test:
    build:
      context: ./app
      target: test
    command: ["pnpm", "run", "test:unit"]
    # Remove the following line to run tests every time
    profiles: ["test"] 